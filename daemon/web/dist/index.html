<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic Virtual Office</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f1221;
        color: #e8ecf5;
        display: grid;

        min-height: 100vh;

        padding: 32px 36px;

        border-radius: 4px;
      }

  <body>
    <main class="card">
      <h1>Agentic Virtual Office</h1>
      <p>The daemon is running. This is a placeholder page.</p>
      <p>
        The office UI is embedded here once a frontend is built: the
        dependency-free fallback UI (FEAT-003) or the production React/Pixi app
        (FEAT-004). The WebSocket endpoint is live at <code>/ws</code>.
      </p>
    </main>
  </body>
</html>
